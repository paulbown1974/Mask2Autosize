name: Build VST3 (Windows)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target TheMask_VST3
      - name: Build and run engine tests
        run: |
          cmake --build build --config Release --target TheMaskEngineTests
          build\Release\TheMaskEngineTests.exe
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: TheMask-VST3
          path: build/TheMask_artefacts/Release/VST3/The Mask.vst3
